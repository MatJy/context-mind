# Local development database only. The backend still runs on the host.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: context_mind
      POSTGRES_DB: context_mind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context_mind -d context_mind"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  postgres_data:
